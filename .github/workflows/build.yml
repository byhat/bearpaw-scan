name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # required to publish releases

jobs:
  linux:
    name: Linux build (Arch container)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm cmake gcc qt6-base qt6-declarative libusb pkgconf

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Smoke test (session must load, QML must parse)
        env:
          QT_QPA_PLATFORM: offscreen
          BEARPAW_AUTOTEST: "1"
        run: |
          timeout 10 ./build/bearpaw-scan 2>&1 | head -3 || test $? -eq 124

      - name: Package binary
        run: |
          strip build/bearpaw-scan
          mv build/bearpaw-scan bearpaw-scan-${{ github.ref_name }}-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: bearpaw-scan-linux-x86_64
          path: bearpaw-scan-*-x86_64

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bearpaw-scan-*-x86_64
